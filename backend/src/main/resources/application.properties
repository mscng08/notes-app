spring.application.name=notes-backend
# Hosts (Render, Railway) inject PORT
server.port=${PORT:8080}

# ---- Database (MySQL) ----
# Reads Railway's MYSQL* variables out of the box; override with your own on any host.
# Local defaults match a default MySQL install; never commit real credentials.
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:notes_db}?createDatabaseIfNotExist=true&useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- CORS: comma-separated origins; wildcards allowed (e.g. https://*.vercel.app) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Graceful shutdown / compression ----
server.shutdown=graceful
server.compression.enabled=true
